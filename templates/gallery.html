<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图库 - PpPpP</title>
<link href="/static/vendor/bootstrap-5.3.3/bootstrap.min.css" rel="stylesheet">
<link href="/static/style.css" rel="stylesheet">
<meta name="csrf-token" content="{{ csrf_token }}">
<style>
/* ── Gallery Cards ── */
.gallery-card {
  border: none;
  border-radius: var(--radius-card);
  overflow: hidden;
  background: var(--bg-elevated);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  height: 100%;
}
.gallery-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-card-hover);
}

.card-img-wrap {
  position: relative;
  background: var(--bg-thumb);
  aspect-ratio: 250 / 250;
  overflow: hidden;
}
.card-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.size-badge {
  position: absolute;
  bottom: 6px;
  right: 6px;
  background: rgba(255,255,255,.85);
  backdrop-filter: blur(6px);
  color: #2b2b2b;
  font-size: 0.68rem;
  padding: 1px 7px;
  border-radius: 4px;
  font-weight: 500;
}

.card-body { padding: 0.6rem 0.7rem; }
.card-title {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-info { font-size: 0.73rem; color: var(--text-secondary); margin-bottom: 0.2rem; }
.tags-wrap { display: flex; flex-wrap: wrap; gap: 3px; margin: 0.25rem 0; }
.tag-badge {
  font-size: 0.62rem;
  background: var(--accent-subtle) !important;
  color: var(--text-muted) !important;
  border-radius: 3px;
  padding: 1px 6px;
}


/* ── Card Checkbox ── */
.card-checkbox {
  position: absolute;
  top: 6px; left: 6px;
  z-index: 3;
  width: 16px; height: 16px;
  accent-color: var(--accent);
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.15s;
}
.gallery-card:hover .card-checkbox,
.card-checkbox:checked { opacity: 1; }

/* ── Card Fav Button ── */
.card-fav-btn {
  position: absolute;
  top: 6px; right: 6px;
  z-index: 3;
  background: rgba(255,255,255,.82);
  backdrop-filter: blur(8px);
  border: none;
  border-radius: 50%;
  width: 28px; height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 0.85rem;
  padding: 0;
  line-height: 1;
  color: #999;
  transition: transform 0.15s, color 0.15s;
}
.card-fav-btn:hover { transform: scale(1.2); }
.card-fav-btn.favorited { color: var(--accent); }
.card-fav-btn.loading { pointer-events: none; opacity: 0.5; }

.card-move-btn { border: none; background: transparent; color: var(--text-muted); cursor: pointer; padding: 0 4px; font-size: 0.78rem; line-height: 1; }
.card-move-btn:hover { color: var(--accent); }
.card-move-btn[hidden] { display: none !important; }
.card-move-btn.loading { opacity: 0.5; pointer-events: none; }

/* ── Batch Float Bar ── */
.batch-float-bar {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-elevated);
  border: 1px solid var(--border-card);
  border-radius: 12px;
  padding: 8px 18px;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: 0 4px 24px rgba(0,0,0,.15);
  z-index: 1050;
  font-size: 0.82rem;
}
.batch-float-bar.hidden { display: none !important; }
.batch-float-bar .btn { font-size: 0.78rem; }
.batch-collection-select {
  font-size: 0.78rem;
  border-radius: 6px;
  border: 1px solid var(--border-input);
  padding: 3px 8px;
  background: var(--bg-page);
  color: var(--text-primary);
}

/* ── Tag Filter ── */
.tag-filter-wrap {
  position: relative;
  margin-bottom: 12px;
}
.tag-filter-input {
  background: var(--bg-elevated) !important;
  border: 1px solid var(--border-input) !important;
  color: var(--text-primary) !important;
  font-size: 0.82rem;
  border-radius: 8px;
  padding: 6px 12px;
  width: 100%;
  max-width: 320px;
}
.tag-filter-input:focus {
  border-color: var(--accent) !important;
  box-shadow: 0 0 0 3px var(--accent-subtle) !important;
  outline: none;
}
.tag-filter-input::placeholder { color: var(--text-muted); }
.tag-filter-active {
  display: inline-block;
  font-size: 0.73rem;
  background: var(--accent-subtle);
  color: var(--accent);
  border: 1px solid rgba(212,67,107,.2);
  padding: 2px 10px;
  border-radius: 5px;
  margin-left: 8px;
}
.tag-filter-clear {
  font-size: 0.7rem;
  color: var(--text-muted);
  cursor: pointer;
  margin-left: 4px;
}
.tag-filter-clear:hover { color: var(--danger); }

/* ── Stats ── */
#stats { color: var(--text-muted) !important; }

</style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a class="navbar-brand" href="/">
      <span class="navbar-brand-dot"></span>
      PpPpP
    </a>
    <button class="nav-toggle" aria-label="菜单" onclick="this.nextElementSibling.classList.toggle('open')">☰</button>
    <div class="navbar-links">
      <a class="navbar-link" href="/">搜索</a>
      <a class="navbar-link active" href="/gallery">图库</a>
      <a class="navbar-link" href="/downloads">下载</a>
      <a class="navbar-link" href="/cache">缓存</a>
      <a class="navbar-link" href="/settings">设置</a>
    </div>
  </div>
</nav>

<div class="full-page">

<div class="container mt-3">
  <div class="d-flex align-items-center flex-wrap gap-2 mb-2">
    <h5 class="mb-0" id="pageTitle">已下载作品</h5>
    <div class="d-flex gap-1 ms-auto toolbar-actions">
      <select id="sortSelect" class="form-select form-select-sm" style="width:auto;">
        <option value="created">按收录时间</option>
        <option value="downloaded">按下载时间</option>
      </select>
      <select id="collectionSelect" class="form-select form-select-sm" style="width:auto;">
        <option value="">全部作品</option>
      </select>
      <a href="/settings" class="btn btn-outline-secondary btn-sm" id="btnManageCollections">管理收藏夹</a>
    </div>
  </div>
  <div class="tag-filter-wrap">
    <input id="tagFilter" class="tag-filter-input" type="text" placeholder="搜索标签..." list="tagList" autocomplete="off">
    <datalist id="tagList"></datalist>
    <span id="tagFilterActive" class="tag-filter-active" style="display:none;"></span>
  </div>
  <div id="cardGrid" class="row"></div>
  <div id="emptyState" class="empty-state" style="display:none;">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
    <h6 id="emptyTitle">暂无已下载作品</h6>
    <p class="small" id="emptyDesc">搜索作品并下载后在此查看</p>
  </div>
  <div id="stats" class="small mb-3" style="display:none;"></div>
  <div id="paginationBar" style="display:none; text-align:center; padding: 1rem 0;">
    <div style="display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:wrap;">
      <button id="prevPageBtn" class="btn btn-sm btn-outline-secondary" disabled>上一页</button>
      <div id="pageNumbers" style="display:flex; gap:4px;"></div>
      <button id="nextPageBtn" class="btn btn-sm btn-outline-primary">下一页</button>
      <span style="color:var(--text-muted); font-size:0.8rem;">跳至</span>
      <input id="pageJumpInput" type="number" min="1" style="width:64px; font-size:0.8rem; padding:2px 6px;">
      <button id="pageJumpBtn" class="btn btn-sm btn-soft">跳转</button>
    </div>
    <div id="paginationStatus" style="font-size:0.72rem; color:var(--text-muted); margin-top:4px;"></div>
  </div>
</div>

<!-- Batch Float Bar -->
<div id="batchFloatBar" class="batch-float-bar hidden">
  <span id="batchFloatCount"></span>
  <button id="btnFloatSelectAll" class="btn btn-sm btn-soft">全选</button>
  <select id="batchCollectionSelect" class="batch-collection-select">
    <option value="">添加到收藏夹...</option>
  </select>
  <button id="btnFloatRemoveColl" class="btn btn-sm btn-outline-warning" style="display:none;">移出收藏夹</button>
  <button id="btnFloatDelete" class="btn btn-sm btn-outline-danger">删除</button>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="liveToast" class="toast align-items-center border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toastMsg"></div>
      <button class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header py-2">
        <h6 class="modal-title">确认删除</h6>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body small" id="deleteModalBody"></div>
      <div class="modal-footer py-1">
        <button class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">取消</button>
        <button class="btn btn-danger btn-sm" id="confirmDeleteBtn">删除</button>
      </div>
    </div>
  </div>
</div>

<script src="/static/vendor/bootstrap-5.3.3/bootstrap.bundle.min.js"></script>
<script src="/static/app.js"></script>
<script src="/static/page-gallery.js"></script>

</div>

<footer class="site-footer">
  <a href="https://github.com/feng-y-u/PpPpP" target="_blank" style="color:inherit;text-decoration:none;">github.com/feng-y-u/PpPpP</a>
</footer>
</body>
</html>
