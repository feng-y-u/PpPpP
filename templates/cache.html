<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>缓存浏览 - PpPpP</title>
<link href="/static/vendor/bootstrap-5.3.3/bootstrap.min.css" rel="stylesheet">
<link href="/static/style.css" rel="stylesheet">
<meta name="csrf-token" content="{{ csrf_token }}">
<style>
/* ── Masonry Grid ── */
.masonry-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 0.8rem;
}
.masonry-item {
  width: calc((100% - 2.4rem) / 4);
}
@media (max-width: 992px) { .masonry-item { width: calc((100% - 1.6rem) / 3); } }
@media (max-width: 768px) { .masonry-item { width: calc((100% - 0.8rem) / 2); } }
@media (max-width: 480px) { .masonry-item { width: calc((100% - 0.4rem) / 2); } .masonry-grid { gap: 0.4rem; } }

/* ── Photo Card ── */
.photo-card {
  position: relative;
  border-radius: var(--radius-card);
  overflow: hidden;
  cursor: pointer;
  background: var(--bg-thumb);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.photo-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-card-hover);
}

.photo-card img {
  display: block;
  width: 100%;
  height: auto;
  transition: transform 0.3s ease;
  background: var(--bg-thumb);
}
.photo-card:hover img {
  transform: scale(1.02);
}

.photo-badges {
  position: absolute;
  top: 6px;
  right: 6px;
  display: flex;
  gap: 3px;
  pointer-events: none;
}
.photo-badge {
  font-size: 0.65rem;
  font-weight: 600;
  background: rgba(255,255,255,.85);
  backdrop-filter: blur(6px);
  color: #2b2b2b;
  padding: 1px 7px;
  border-radius: 4px;
  pointer-events: none;
}

/* Card info below image */
.photo-card-info {
  padding: 0.5rem 0.4rem;
}
.photo-card-title {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 0.1rem;
}
.photo-card-artist {
  font-size: 0.7rem;
  color: var(--text-secondary);
}

/* Tags below card */
.photo-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  margin-top: 0.15rem;
}
.photo-tag {
  font-size: 0.62rem;
  color: var(--text-muted);
  padding: 1px 6px;
  border-radius: 3px;
  background: var(--accent-subtle);
}

/* Card actions (download) */
.photo-card-actions {
  margin-top: 0.35rem;
}
.photo-card-actions .btn {
  font-size: 0.68rem;
  padding: 0.2rem 0.7rem;
  border-radius: 5px;
  font-weight: 500;
}
</style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a class="navbar-brand" href="/">
      <span class="navbar-brand-dot"></span>
      PpPpP
    </a>
    <button class="nav-toggle" aria-label="菜单" onclick="this.nextElementSibling.classList.toggle('open')">☰</button>
    <div class="navbar-links">
      <a class="navbar-link" href="/">搜索</a>
      <a class="navbar-link" href="/gallery">图库</a>
      <a class="navbar-link" href="/downloads">下载</a>
      <a class="navbar-link active" href="/cache">缓存</a>
      <a class="navbar-link" href="/settings">设置</a>
    </div>
  </div>
</nav>

<div class="full-page">
<div class="container mt-3">
  <div class="d-flex align-items-center gap-2 flex-wrap mb-3">
    <select class="form-select form-select-sm" id="cacheTagSelect" style="max-width:220px;"></select>
    <input class="form-control form-control-sm" id="cacheMinBookmarks" type="number" min="0" placeholder="最低收藏数" style="max-width:120px;">
    <select class="form-select form-select-sm" id="cacheSortOrder" style="max-width:140px;">
      <option value="date_d">最新发布</option>
      <option value="popular_d">人气（收藏数）</option>
    </select>
    <select class="form-select form-select-sm" id="cacheR18" style="max-width:120px;">
      <option value="safe">不含R18</option>
      <option value="all">包含R18</option>
    </select>
    <input class="form-control form-control-sm" id="cacheFilterTag" type="text" list="cacheTagList" placeholder="按作品标签过滤..." style="max-width:180px;" autocomplete="off">
    <datalist id="cacheTagList"></datalist>
    <button class="btn btn-primary btn-sm" id="cacheBrowseBtn">浏览</button>
    <button class="btn btn-soft btn-sm" id="cacheRefreshBtn" disabled>刷新</button>
  </div>
  <div id="cacheMeta" style="font-size:0.75rem;color:var(--text-muted);margin-bottom:8px;"></div>
  <div id="masonryGrid" class="masonry-grid"></div>
  <div id="emptyState" style="display:none;text-align:center;color:var(--text-muted);padding:40px 0;">暂无缓存数据</div>
  <div id="paginationBar" style="display:none;text-align:center;margin:16px 0;">
    <button class="btn btn-sm btn-soft" id="prevPageBtn" disabled>上一页</button>
    <span id="paginationStatus" style="margin:0 12px;font-size:0.8rem;"></span>
    <button class="btn btn-sm btn-soft" id="nextPageBtn" disabled>下一页</button>
    <span style="margin-left:8px;font-size:0.8rem;">
      跳至 <input id="pageJumpInput" type="number" min="1" style="width:56px;padding:2px 6px;"> 页
      <button class="btn btn-sm btn-soft" id="pageJumpBtn">跳转</button>
    </span>
  </div>
</div>
</div>

<!-- Toast -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="liveToast" class="toast align-items-center border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toastMsg"></div>
      <button class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="/static/vendor/bootstrap-5.3.3/bootstrap.bundle.min.js"></script>
<script src="/static/app.js"></script>
<script src="/static/page-cache.js"></script>
<footer class="site-footer">
  <a href="https://github.com/feng-y-u/PpPpP" target="_blank" style="color:inherit;text-decoration:none;">github.com/feng-y-u/PpPpP</a>
</footer>
</body>
</html>
