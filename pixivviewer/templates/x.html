<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PpPpP · X 图片</title>
<link href="/static/vendor/bootstrap-5.3.3/bootstrap.min.css" rel="stylesheet">
<link href="/static/style.css" rel="stylesheet">
<meta name="csrf-token" content="{{ csrf_token }}">
<meta name="items-per-page" content="{{ items_per_page }}">
<style>
  /* ── 与缓存浏览页同一套瀑布流/卡片（一致性改造 2026-11-20）──
     样式逐行取自 cache.html：X 卡片与 Pixiv 缓存卡片是同一个组件，
     差异只在徽标集合与操作按钮。 */
  .masonry-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 0.8rem;
  }
  .masonry-item {
    width: calc((100% - 2.4rem) / 4);
  }
  @media (max-width: 992px) { .masonry-item { width: calc((100% - 1.6rem) / 3); } }
  @media (max-width: 768px) { .masonry-item { width: calc((100% - 0.8rem) / 2); } }
  @media (max-width: 480px) { .masonry-item { width: calc((100% - 0.4rem) / 2); } .masonry-grid { gap: 0.4rem; } }

  .photo-card {
    position: relative;
    border-radius: var(--radius-card);
    overflow: hidden;
    cursor: pointer;
    background: var(--bg-elevated);
    box-shadow: var(--shadow-card);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .photo-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-card-hover);
  }
  .photo-card img {
    display: block;
    width: 100%;
    height: auto;
    transition: transform 0.3s ease;
    background: var(--bg-thumb);
  }
  .photo-card:hover img {
    transform: scale(1.02);
  }
  .photo-badges {
    position: absolute;
    top: 6px;
    right: 6px;
    display: flex;
    gap: 3px;
    pointer-events: none;
  }
  .photo-badge {
    font-size: 0.65rem;
    font-weight: 600;
    background: rgba(255,255,255,.85);
    backdrop-filter: blur(6px);
    color: #2b2b2b;
    padding: 1px 7px;
    border-radius: 4px;
    pointer-events: none;
  }
  .photo-badge.ok { background: rgba(59,138,94,.85); color: #fff; }
  .photo-badge.warn { background: rgba(192,138,46,.88); color: #fff; }

  .photo-card-info {
    padding: 0.5rem 0.4rem;
  }
  .photo-card-title {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 0.1rem;
  }
  .photo-card-artist {
    font-size: 0.7rem;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .photo-card-text {
    font-size: 0.68rem;
    color: var(--text-secondary);
    line-height: 1.45;
    margin-top: 0.15rem;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .photo-card-actions {
    margin-top: 0.35rem;
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    align-items: center;
  }
  .photo-card-actions .btn {
    font-size: 0.68rem;
    padding: 0.2rem 0.7rem;
    border-radius: var(--radius-btn);
    font-weight: 500;
  }
  .photo-card-actions .btn-del { margin-left: auto; padding: 0.1rem 0.5rem; line-height: 1.3; }

  .x-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 22px 0 10px; flex-wrap: wrap; }
  .x-title { font-family: var(--font-display); font-size: 20px; font-weight: 650; margin: 0; color: var(--ink); }
  .x-sub { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-mute); margin-top: 4px; }
  .x-tagbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .x-tag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
           background: var(--accent-subtle); color: var(--accent); font-size: 12px; cursor: pointer; border: 1px solid rgba(46,155,234,.25); }
  .x-tag.active { background: var(--accent); color: #fff; }
  .x-tag .del { opacity: .65; font-size: 11px; }
  .x-tag .ref { opacity: .65; font-size: 11px; }
  .x-tag .err { color: var(--danger); }
  .x-tag .live { font-size: 10.5px; opacity: .9; }
  .x-tag.fetching { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-subtle); }
  .x-tag.fetching .live { color: inherit; }
  .x-links { border: 1px solid var(--border-subtle); border-radius: var(--radius-card);
             padding: 10px 12px; margin: 4px 0 12px; background: var(--bg-elevated); }
  .x-links summary { cursor: pointer; font-size: 12.5px; color: var(--ink-soft); user-select: none; }
  .x-links .x-link-form { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 8px; }
  .x-links .x-link-form input { max-width: 180px; }
  .x-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .x-empty { text-align: center; color: var(--ink-mute); padding: 48px 12px; }
  .x-status { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-mute); margin-bottom: 8px; }
  .x-status .warn { color: var(--amber); }
</style>
</head>
<body>

<div class="full-page">

<nav class="navbar">
  <div class="navbar-inner">
    <a class="navbar-brand" href="/">
      <span class="navbar-brand-dot"></span>
      PpPpP
    </a>
    <button class="nav-toggle" aria-label="菜单">☰</button>
    <div class="navbar-links">
      <a class="navbar-link" href="/">首页</a>
      <a class="navbar-link" href="/explore">搜索</a>
      <a class="navbar-link" href="/gallery">图库</a>
      <a class="navbar-link" href="/downloads">下载</a>
      <a class="navbar-link" href="/cache">缓存</a>
      <a class="navbar-link active" href="/x">X 图片</a>
      <a class="navbar-link" href="/settings">设置</a>
    </div>
  </div>
</nav>

<div class="container">
  <div class="x-head">
    <div>
      <h1 class="x-title">X 图片</h1>
      <div class="x-sub">按标签抓取推文图片 · 与 Pixiv 图库做同作品判定</div>
    </div>
    <div class="x-sub" id="xCount">0 条</div>
  </div>

  <div class="x-toolbar">
    <input id="xTagInput" class="form-control form-control-sm" style="max-width:280px;"
           placeholder="标签或搜索词，如 #原神" autocomplete="off">
    <button id="xTagAddBtn" class="btn btn-sm btn-soft">添加并抓取</button>
    <button id="xDupFilter" class="btn btn-sm btn-outline-secondary" data-mode="all">显示：全部</button>
    <button id="xSavedFilter" class="btn btn-sm btn-outline-secondary" data-mode="all">全部作品</button>
    <button id="xRefreshBtn" class="btn btn-sm btn-outline-secondary">刷新列表</button>
  </div>

  <div id="xStatus" class="x-status"></div>
  <div id="xTagBar" class="x-tagbar"></div>

  <details class="x-links" id="xLinkBox">
    <summary>画师映射（Pixiv ↔ X，让「疑似同一作品」生效）</summary>
    <div class="x-link-form">
      <input id="xLinkUid" class="form-control form-control-sm" placeholder="Pixiv 数字 UID（如 12345）" autocomplete="off">
      <input id="xLinkHandle" class="form-control form-control-sm" placeholder="X 用户名（如 artist_a）" autocomplete="off">
      <button id="xLinkAddBtn" class="btn btn-sm btn-soft">添加映射</button>
    </div>
    <div id="xLinkList" class="x-tagbar" style="margin:0;"></div>
  </details>

  <div id="xGrid" class="masonry-grid"></div>
  <div id="xEmpty" class="x-empty" style="display:none;">还没有抓取过。先在上面添加一个标签。</div>

  <div style="text-align:center;padding:18px 0;">
    <button id="xMoreBtn" class="btn btn-sm btn-soft" style="display:none;">加载更多</button>
  </div>
  <div style="text-align:center;padding:10px 0 26px;" id="xPageNote" class="x-sub"></div>
</div>

</div>

<!-- Toast -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="liveToast" class="toast align-items-center border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toastMsg"></div>
      <button class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="/static/vendor/bootstrap-5.3.3/bootstrap.bundle.min.js"></script>
<script src="/static/app.js"></script>
<script src="/static/page-x.js"></script>
</body>
</html>
